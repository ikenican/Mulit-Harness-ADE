# Workbench 擴充清單：唯一真相，由 Customized 面板產生各家 agent 的原生設定。
# 憑證不放這裡 —— env 值寫 ${conn:名稱}，實際值存 OS 加密儲存，spawn 時才注入。
#
# targets 可填：claude / antigravity / codex（codex 目前 pending，填了也不會產生輸出）
version: 1

skills: []

mcp:
  # 本專案自帶的硬體分析 MCP server（純標準庫，無需 pip 安裝）
  # 工具：usb_list_devices / usb_parse_descriptor / pcap_summary / analyze_log
  - id: hardware
    command: py
    args:
      - '-3'
      - tools/hardware-mcp/server.py
    env: {}
    targets:
      - claude
      - antigravity

plugins: []
