appId: io.github.zkylek1212-k.agent-workbench-linux
productName: Agent Workbench Linux
copyright: MIT
publish: null

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

asarUnpack:
  - '**/node_modules/@lydell/node-pty*/**'

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  category: Development
  artifactName: Agent-Workbench-Linux-${version}-x64.${ext}
  executableName: agent-workbench-linux
  maintainer: zkylek1212-k

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
